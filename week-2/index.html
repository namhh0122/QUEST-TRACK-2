<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 플레이리스트</title>
  <style>
    :root {
      --bg: #14121f;
      --panel: #1f1c30;
      --row: #28243d;
      --row-hover: #332e4d;
      --accent: #ff6fa8;
      --accent2: #8f7cff;
      --text: #f2f0fa;
      --muted: #a39fbd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a2050, var(--bg) 60%);
      color: var(--text);
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .app { width: 100%; max-width: 560px; }

    h1 { margin: 0 0 4px; font-size: 28px; }
    .summary { color: var(--muted); margin-bottom: 20px; font-size: 14px; }

    /* 지금 재생 중 */
    .player {
      background: var(--panel);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .now-label { font-size: 12px; color: var(--accent); letter-spacing: 1px; }
    .now-title { font-size: 22px; font-weight: bold; margin: 6px 0 2px; }
    .now-artist { color: var(--muted); }
    .progress {
      height: 6px; background: var(--row); border-radius: 3px;
      margin: 16px 0 6px; overflow: hidden; cursor: pointer;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }
    .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .controls { display: flex; justify-content: center; gap: 14px; margin-top: 14px; }
    .controls button {
      background: var(--row); color: var(--text); border: none;
      width: 48px; height: 48px; border-radius: 50%;
      font-size: 18px; cursor: pointer;
    }
    .controls button:hover { background: var(--row-hover); }
    .controls .play { background: #f5c242; width: 58px; height: 58px; font-size: 22px; }
    .controls .play:hover { background: #e0ab24; }
    .controls .on { outline: 2px solid var(--accent); }

    /* 곡 목록 */
    .list { list-style: none; padding: 0; margin: 0 0 20px; }
    .song {
      display: flex; align-items: center; gap: 12px;
      background: var(--row); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    }
    .song:hover { background: var(--row-hover); }
    .song.playing { outline: 2px solid var(--accent); }
    .num { width: 22px; text-align: center; color: var(--muted); }
    .song.playing .num { color: var(--accent); }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 13px; color: var(--muted); }
    .len { font-size: 13px; color: var(--muted); }
    .del {
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 0 4px;
    }
    .del:hover { color: var(--accent); }
    .empty { text-align: center; color: var(--muted); padding: 20px; }

    /* 곡 추가 */
    form {
      background: var(--panel); border-radius: 14px; padding: 14px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    form input {
      flex: 1 1 140px; min-width: 0;
      background: var(--row); border: none; border-radius: 8px;
      color: var(--text); padding: 10px; font-size: 14px;
    }
    form input.short { flex: 0 1 80px; }
    form button {
      background: var(--accent2); color: white; border: none;
      border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer;
    }
    .help { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎧 나의 플레이리스트</h1>
    <div class="summary" id="summary"></div>

    <div class="player">
      <div class="now-label">지금 재생 중</div>
      <div class="now-title" id="nowTitle">곡을 골라 주세요</div>
      <div class="now-artist" id="nowArtist">&nbsp;</div>
      <div class="progress" id="progress"><div class="progress-fill" id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="total">0:00</span></div>
      <div class="controls">
        <button id="shuffleBtn" title="섞어 듣기">🔀</button>
        <button id="prevBtn" title="이전 곡">⏮</button>
        <button id="playBtn" class="play" title="재생 / 멈춤">▶</button>
        <button id="nextBtn" title="다음 곡">⏭</button>
        <button id="repeatBtn" title="목록 반복">🔁</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>

    <form id="addForm">
      <input id="inTitle" placeholder="곡 제목" required>
      <input id="inArtist" placeholder="가수" required>
      <input id="inLen" class="short" placeholder="3:30" pattern="\d{1,2}:\d{2}" title="분:초 (예: 3:30)">
      <button type="submit">추가</button>
    </form>
    <div class="help">
      곡을 누르면 재생돼요 · ✕ 로 지우기 · 진행 막대를 누르면 그 위치로 이동<br>
      ※ 실제 소리는 나지 않는 연습용 플레이어예요. 목록은 이 브라우저에 저장돼요.
    </div>
  </div>

  <script>
    const START_SONGS = [
      { title: "Hype Boy", artist: "NewJeans", len: 179 },
      { title: "Dynamite", artist: "BTS", len: 199 },
      { title: "Next Level", artist: "aespa", len: 221 },
      { title: "Love Dive", artist: "IVE", len: 177 },
      { title: "Shape of You", artist: "Ed Sheeran", len: 233 },
    ];

    let songs;
    try { songs = JSON.parse(localStorage.getItem("playlist")) || START_SONGS; }
    catch { songs = START_SONGS; }

    let current = -1;     // 지금 곡 번호 (-1 = 없음)
    let time = 0;         // 지금 곡에서 흐른 초
    let playing = false;
    let shuffle = false;
    let repeat = true;
    let timer = null;

    const $ = id => document.getElementById(id);

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    function save() {
      try { localStorage.setItem("playlist", JSON.stringify(songs)); } catch {}
    }

    function render() {
      const list = $("list");
      list.innerHTML = "";
      if (songs.length === 0) {
        list.innerHTML = '<li class="empty">아직 곡이 없어요. 아래에서 추가해 보세요!</li>';
      }
      songs.forEach((song, i) => {
        const li = document.createElement("li");
        li.className = "song" + (i === current ? " playing" : "");
        li.innerHTML = `
          <span class="num">${i === current && playing ? "♪" : i + 1}</span>
          <div class="info">
            <div class="title"></div>
            <div class="artist"></div>
          </div>
          <span class="len">${fmt(song.len)}</span>
          <button class="del" title="지우기">✕</button>`;
        li.querySelector(".title").textContent = song.title;
        li.querySelector(".artist").textContent = song.artist;
        li.onclick = () => playSong(i);
        li.querySelector(".del").onclick = e => { e.stopPropagation(); removeSong(i); };
        list.appendChild(li);
      });

      const totalSec = songs.reduce((sum, s) => sum + s.len, 0);
      $("summary").textContent = `${songs.length}곡 · 총 ${Math.floor(totalSec / 60)}분 ${totalSec % 60}초`;

      const song = songs[current];
      $("nowTitle").textContent = song ? song.title : "곡을 골라 주세요";
      $("nowArtist").innerHTML = song ? "" : "&nbsp;";
      if (song) $("nowArtist").textContent = song.artist;
      $("total").textContent = fmt(song ? song.len : 0);
      $("playBtn").textContent = playing ? "⏸" : "▶";
      $("shuffleBtn").classList.toggle("on", shuffle);
      $("repeatBtn").classList.toggle("on", repeat);
      updateBar();
    }

    function updateBar() {
      const song = songs[current];
      $("fill").style.width = song ? (time / song.len * 100) + "%" : "0%";
      $("cur").textContent = fmt(time);
    }

    function playSong(i) {
      current = i;
      time = 0;
      playing = true;
      startTimer();
      render();
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (!playing) return;
        time++;
        if (time >= songs[current].len) next();
        else updateBar();
      }, 1000);
    }

    function togglePlay() {
      if (songs.length === 0) return;
      if (current === -1) return playSong(0);
      playing = !playing;
      if (playing) startTimer();
      render();
    }

    function next() {
      if (songs.length === 0) return;
      if (shuffle && songs.length > 1) {
        let n;
        do { n = Math.floor(Math.random() * songs.length); } while (n === current);
        return playSong(n);
      }
      if (current + 1 < songs.length) return playSong(current + 1);
      if (repeat) return playSong(0);
      playing = false;   // 목록 끝
      time = 0;
      render();
    }

    function prev() {
      if (songs.length === 0) return;
      if (time > 3) return playSong(current);   // 3초 넘게 들었으면 처음부터
      playSong(current > 0 ? current - 1 : songs.length - 1);
    }

    function removeSong(i) {
      songs.splice(i, 1);
      if (i === current) { current = -1; playing = false; time = 0; }
      else if (i < current) current--;
      save();
      render();
    }

    $("addForm").onsubmit = e => {
      e.preventDefault();
      const lenText = $("inLen").value.trim() || "3:30";
      const [m, s] = lenText.split(":").map(Number);
      songs.push({
        title: $("inTitle").value.trim(),
        artist: $("inArtist").value.trim(),
        len: m * 60 + s,
      });
      save();
      e.target.reset();
      render();
    };

    $("progress").onclick = e => {
      const song = songs[current];
      if (!song) return;
      const rect = e.currentTarget.getBoundingClientRect();
      time = Math.floor((e.clientX - rect.left) / rect.width * song.len);
      updateBar();
    };

    $("playBtn").onclick = togglePlay;
    $("nextBtn").onclick = next;
    $("prevBtn").onclick = prev;
    $("shuffleBtn").onclick = () => { shuffle = !shuffle; render(); };
    $("repeatBtn").onclick = () => { repeat = !repeat; render(); };

    render();
  </script>
</body>
</html>
