<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>연습 게임 · 딸기 모으기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
  canvas { image-rendering: pixelated; }
  p { position: fixed; bottom: 8px; left: 0; right: 0; margin: 0; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<p>← → 이동 · 스페이스 점프 · 딸기를 모아 봐 (처음 키를 누르면 음악이 나와요)</p>
<script>
// ===== 에셋 불러오기 =====
// 그림은 assets/images, 소리는 assets/sounds 에 있어요.
const IMG = 'assets/images/';
const SND = 'assets/sounds/';

// 애니메이션 정보 (drop.json 에서 옮김). 모든 시트는 32×32 프레임이 가로 한 줄로 이어져 있어요.
const ANIMS = {
  frog: {
    idle:          { file: 'ninja-frog_idle.png',        frames: 11, fps: 20, loop: true },
    run:           { file: 'ninja-frog_run.png',         frames: 12, fps: 20, loop: true },
    jump:          { file: 'ninja-frog_jump.png',        frames: 1,  fps: 20, loop: true },
    'double-jump': { file: 'ninja-frog_double-jump.png', frames: 6,  fps: 20, loop: true },
    fall:          { file: 'ninja-frog_fall.png',        frames: 1,  fps: 10, loop: true },
    'wall-jump':   { file: 'ninja-frog_wall-jump.png',   frames: 5,  fps: 20, loop: true },
    hit:           { file: 'ninja-frog_hit.png',         frames: 7,  fps: 20, loop: false },
  },
  strawberry: {
    spin:          { file: 'strawberry_spin.png',        frames: 17, fps: 12, loop: true },
  },
};
const FRAME = 32; // 프레임 한 칸 크기
const TILE = 16;  // 지형 타일 한 칸 크기

function loadImage(file) {
  const img = new Image();
  img.src = IMG + file;
  return img;
}

// 캐릭터·아이템 시트
for (const group of Object.values(ANIMS)) {
  for (const anim of Object.values(group)) anim.img = loadImage(anim.file);
}
const tilesetImg = loadImage('terrain-tileset.png');           // 352×176, 16×16 타일
const backgroundImg = loadImage('blue-pattern-background.png'); // 64×64, 바둑판처럼 깔기

// 소리
const sounds = {
  jump: new Audio(SND + 'jump.wav'),
  coin: new Audio(SND + 'coin.wav'),
};
const bgm = new Audio(SND + 'stage-1.ogg');
bgm.loop = true;   // 끊김 없이 반복
bgm.volume = 0.5;

function playSound(name) {
  const s = sounds[name].cloneNode(); // 겹쳐서 여러 번 나도록 복사해서 재생
  s.play();
}

// 브라우저는 사용자가 키를 누르거나 클릭하기 전에는 소리를 못 내게 해서, 처음 누를 때 음악을 켜요.
function startMusic() {
  if (bgm.paused) bgm.play();
}
addEventListener('keydown', startMusic);
addEventListener('pointerdown', startMusic);

// ===== 그리기 도구 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 270; // 게임 세상 크기. 위치·속도는 모두 이 크기 기준이에요. 크게 할수록 개구리·땅이 화면에서 작아 보여요.

// 창 크기에 맞춰 게임 세상을 비율대로 늘려서 그려요.
// 그림도 같은 배율로 커지고, 창 비율이 다르면 남는 곳은 검게 둬요.
// 캔버스를 실제 화면 크기로 만들고 그릴 때 늘리기 때문에, 글자는 또렷하게 나와요.
function fitToWindow() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = devicePixelRatio || 1;
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false; // 픽셀 아트가 흐려지지 않게 (최근접 필터). 캔버스 크기를 바꾸면 풀려서 다시 켜요.
}
addEventListener('resize', fitToWindow);
fitToWindow();

// 애니메이션의 지금 프레임 그리기. time 은 이 애니메이션을 시작한 뒤 지난 초.
function drawAnim(anim, time, x, y, flip) {
  let frame = Math.floor(time * anim.fps);
  frame = anim.loop ? frame % anim.frames : Math.min(frame, anim.frames - 1);
  ctx.save();
  if (flip) {
    ctx.translate(x + FRAME, y);
    ctx.scale(-1, 1);
    x = 0; y = 0;
  }
  ctx.drawImage(anim.img, frame * FRAME, 0, FRAME, FRAME, x, y, FRAME, FRAME);
  ctx.restore();
}

// 타일셋의 (열, 줄) 칸 하나 그리기
function drawTile(col, row, x, y) {
  ctx.drawImage(tilesetImg, col * TILE, row * TILE, TILE, TILE, x, y, TILE, TILE);
}

function drawBackground() {
  for (let y = 0; y < H; y += 64)
    for (let x = 0; x < W; x += 64)
      ctx.drawImage(backgroundImg, x, y);
}

// ===== 게임 =====
const GROUND_Y = H - TILE * 2; // 땅 윗면
const GRAVITY = 900;
const SPEED = 110;
const JUMP = 300;

// 하늘에 떠 있는 땅. 층 사이는 60px 이라 2단 점프로 올라갈 수 있어요.
// 아래에서는 뚫고 올라가고, 위에서 내려올 때만 밟혀요.
const PLATFORMS = [
  { x: 48,  y: 178, w: 5 * TILE }, { x: 208, y: 178, w: 4 * TILE }, { x: 368, y: 178, w: 5 * TILE },
  { x: 128, y: 118, w: 4 * TILE }, { x: 288, y: 118, w: 4 * TILE },
  { x: 32,  y: 58,  w: 4 * TILE }, { x: 208, y: 58,  w: 4 * TILE }, { x: 384, y: 58,  w: 4 * TILE },
];
// 개구리가 서 있을 수 있는 곳 (바닥 땅 + 떠 있는 땅)
const SURFACES = [{ x: 0, y: GROUND_Y, w: W }, ...PLATFORMS];

const frog = { x: 40, y: GROUND_Y - FRAME, vx: 0, vy: 0, onGround: true, flip: false, anim: 'idle', animTime: 0, jumps: 0 };
let berries = [];
let score = 0;

const BERRY_COUNT = 15;
const BERRY_GAP = 24;    // 딸기끼리 이만큼은 떨어지게
const BERRY_RISE = 60;   // 딸기는 밟을 수 있는 땅 위로 이 높이 안에서만 나와요 (2단 점프로 닿는 높이)
const BERRY_TOP = 10;

function random(min, max) {
  return min + Math.random() * (max - min);
}

// 딸기 그림(32×32)에서 실제로 보이는 부분이 떠 있는 땅과 겹치는지
function touchesPlatform(b) {
  return PLATFORMS.some(p => b.x + 24 > p.x && b.x + 8 < p.x + p.w && b.y + 26 > p.y && b.y + 6 < p.y + TILE);
}

// 딸기를 화면 곳곳에 무작위로 뿌려요. 새로 시작할 때마다, 다 모았을 때마다 위치가 바뀌어요.
// 넓은 땅일수록 딸기가 많이 나오게 땅 길이만큼 뽑힐 확률을 줘요.
function spawnBerries() {
  berries = [];
  const total = SURFACES.reduce((sum, s) => sum + s.w, 0);
  for (let tries = 0; berries.length < BERRY_COUNT && tries < 1000; tries++) {
    let pick = random(0, total);
    const s = SURFACES.find(s => (pick -= s.w) < 0) || SURFACES[0];
    const x = Math.max(0, Math.min(W - FRAME, random(s.x - 8, s.x + s.w - FRAME + 8)));
    const y = Math.max(BERRY_TOP, s.y - FRAME - random(0, BERRY_RISE));
    const b = { x, y };
    const tooClose = p => Math.hypot(p.x - b.x, p.y - b.y) < BERRY_GAP;
    const onScore = b.x < 110 && b.y < 30; // 왼쪽 위 점수 자리
    if (berries.some(tooClose) || tooClose(frog) || touchesPlatform(b) || onScore) continue; // 겹치면 다시 뽑기
    berries.push(b);
  }
}
spawnBerries();

const keys = {};
addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && frog.jumps < 2) {
    frog.vy = -JUMP;
    frog.onGround = false;
    frog.jumps++;
    playSound('jump');
  }
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// 키를 누른 채 다른 창으로 가면 손을 떼도 keyup 이 안 와서 계속 달려요. 그래서 창을 떠나면 키를 모두 놓아요.
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function setAnim(name) {
  if (frog.anim !== name) { frog.anim = name; frog.animTime = 0; }
}

function update(dt) {
  frog.vx = (keys.ArrowRight ? SPEED : 0) - (keys.ArrowLeft ? SPEED : 0);
  if (frog.vx) frog.flip = frog.vx < 0;
  frog.x = Math.max(0, Math.min(W - FRAME, frog.x + frog.vx * dt));

  const prevFeet = frog.y + FRAME;
  frog.vy += GRAVITY * dt;
  frog.y += frog.vy * dt;
  const feet = frog.y + FRAME;

  // 내려오다가 발이 땅 윗면을 지나가면 그 위에 세워요. 땅 끝에서 걸어 나가면 떨어져요.
  // 개구리 그림 양옆의 빈칸(8px)은 빼고 몸통이 걸쳐야 밟혀요.
  frog.onGround = false;
  if (frog.vy >= 0) {
    for (const s of SURFACES) {
      const over = frog.x + 24 > s.x && frog.x + 8 < s.x + s.w;
      if (over && prevFeet <= s.y + 1 && feet >= s.y) {
        frog.y = s.y - FRAME;
        frog.vy = 0;
        frog.onGround = true;
        frog.jumps = 0;
        break;
      }
    }
  }
  // 바닥 땅은 무슨 일이 있어도 뚫고 내려가지 않게 해요.
  if (feet > GROUND_Y) {
    frog.y = GROUND_Y - FRAME;
    frog.vy = 0;
    frog.onGround = true;
    frog.jumps = 0;
  }

  if (!frog.onGround) setAnim(frog.vy > 0 ? 'fall' : frog.jumps === 2 ? 'double-jump' : 'jump');
  else setAnim(frog.vx ? 'run' : 'idle');
  frog.animTime += dt;

  // 딸기 먹기
  berries = berries.filter(b => {
    const hit = Math.abs(b.x - frog.x) < 18 && Math.abs(b.y - frog.y) < 18;
    if (hit) { score++; playSound('coin'); }
    return !hit;
  });
  if (berries.length === 0) spawnBerries();
}

let clock = 0;
function draw() {
  drawBackground();

  // 풀 덮인 땅 (타일셋 왼쪽 위에서 7번째 열부터 3칸)
  for (let x = 0; x < W; x += TILE) {
    const col = x === 0 ? 6 : x + TILE >= W ? 8 : 7;
    drawTile(col, 0, x, GROUND_Y);
    drawTile(col, 1, x, GROUND_Y + TILE);
  }

  // 떠 있는 땅 (같은 풀 타일의 윗줄만)
  for (const p of PLATFORMS) {
    for (let x = p.x; x < p.x + p.w; x += TILE) {
      const col = x === p.x ? 6 : x + TILE >= p.x + p.w ? 8 : 7;
      drawTile(col, 0, x, p.y);
    }
  }

  for (const b of berries) drawAnim(ANIMS.strawberry.spin, clock, b.x, b.y, false);
  drawAnim(ANIMS.frog[frog.anim], frog.animTime, frog.x, frog.y, frog.flip);

  // 점수: 딸기 그림 + 픽셀 숫자
  drawAnim(ANIMS.strawberry.spin, 0, 2, 0, false);
  drawPixelText('x' + score, 32, 9);
}

// 점수용 픽셀 글자. 한 글자는 가로 3칸 × 세로 5칸이고, 1 이 칠할 칸이에요.
const PIXEL_FONT = {
  '0': ['111', '101', '101', '101', '111'],
  '1': ['010', '110', '010', '010', '111'],
  '2': ['111', '001', '111', '100', '111'],
  '3': ['111', '001', '111', '001', '111'],
  '4': ['101', '101', '111', '001', '001'],
  '5': ['111', '100', '111', '001', '111'],
  '6': ['111', '100', '111', '101', '111'],
  '7': ['111', '001', '010', '010', '010'],
  '8': ['111', '101', '111', '101', '111'],
  '9': ['111', '101', '111', '001', '111'],
  'x': ['000', '101', '010', '101', '000'],
};
const PIXEL = 3; // 글자 한 칸 크기

// 픽셀 글자를 진한 테두리 → 흰 글자 순서로 작은 캔버스에 그린 뒤, 한 번에 화면에 옮겨요.
// 칸마다 바로 화면에 그리면 늘린 화면에서 칸 사이에 가는 줄이 생겨서 이렇게 해요.
const textCanvas = document.createElement('canvas');
const textCtx = textCanvas.getContext('2d');
let lastText = '';

function drawPixelText(text, x, y) {
  if (text !== lastText) {
    lastText = text;
    textCanvas.width = text.length * 4 * PIXEL + 2;
    textCanvas.height = 5 * PIXEL + 2;
    for (const [color, grow] of [['#2b1d2e', 1], ['#fff', 0]]) {
      textCtx.fillStyle = color;
      [...text].forEach((ch, i) => {
        const rows = PIXEL_FONT[ch];
        if (!rows) return;
        rows.forEach((row, r) => {
          for (let c = 0; c < 3; c++) {
            if (row[c] !== '1') continue;
            const px = 1 + i * 4 * PIXEL + c * PIXEL;
            const py = 1 + r * PIXEL;
            textCtx.fillRect(px - grow, py - grow, PIXEL + grow * 2, PIXEL + grow * 2);
          }
        });
      });
    }
  }
  ctx.drawImage(textCanvas, x - 1, y - 1);
}

let last = performance.now();
function loop(now) {
  // 첫 프레임은 now 가 last 보다 앞설 수 있어서, 지난 시간이 마이너스가 되지 않게 0 아래는 0으로 둬요.
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
  last = now;
  clock += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
