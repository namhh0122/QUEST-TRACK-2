<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평택시 날씨</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(160deg, #4a7fc1, #24476e);
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 480px;
    padding: clamp(20px, 6vw, 40px);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight: 600;
  }
  .sub {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.8;
  }
  .now { margin: clamp(16px, 5vw, 28px) 0; }
  .temp {
    font-size: clamp(64px, 22vw, 112px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
  }
  .desc {
    margin-top: 8px;
    font-size: clamp(26px, 8vw, 40px);
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .range {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    font-size: clamp(15px, 4.2vw, 18px);
  }
  .range span b { font-weight: 700; }
  .time {
    margin-top: 16px;
    font-size: 13px;
    opacity: 0.75;
  }
  .message {
    margin: 28px 0 8px;
    font-size: clamp(17px, 4.8vw, 20px);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .message small {
    display: block;
    margin-top: 6px;
    font-size: 14px;
    opacity: 0.8;
  }
  button {
    margin-top: 12px;
    padding: 10px 22px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #24476e;
    background: #fff;
    cursor: pointer;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>평택시 날씨</h1>
  <p class="sub">경기도 평택시 · 지금 날씨</p>

  <!-- 불러오는 동안 -->
  <div id="loading" class="message" role="status">날씨를 불러오는 중이에요…</div>

  <!-- 못 받아 왔을 때 -->
  <div id="error" class="message" role="alert" hidden>
    <div id="error-text"></div>
    <button id="retry" type="button">다시 불러오기</button>
  </div>

  <!-- 받아 왔을 때 -->
  <div id="weather" hidden>
    <div class="now">
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
    </div>
    <div class="range">
      <span>최고 <b id="max"></b></span>
      <span>최저 <b id="min"></b></span>
    </div>
    <div class="time" id="time"></div>
  </div>
</main>

<script>
// 평택시 좌표 (Open-Meteo 지명 검색으로 찾음). API 키는 필요 없어요.
const PLACE = { lat: 36.99472, lon: 127.08889 };
const API_URL = 'https://api.open-meteo.com/v1/forecast'
  + `?latitude=${PLACE.lat}&longitude=${PLACE.lon}`
  + '&current=temperature_2m,weather_code'
  + '&daily=temperature_2m_max,temperature_2m_min'
  + '&timezone=Asia%2FSeoul&forecast_days=1';
const WAIT_LIMIT = 10000; // 10초 안에 답이 없으면 그만 기다려요

// 날씨 번호(WMO 코드) → 한국어 낱말
function weatherWord(code) {
  const words = {
    0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림',
    45: '안개', 48: '서리 안개',
    51: '약한 이슬비', 53: '이슬비', 55: '강한 이슬비',
    56: '어는 이슬비', 57: '강한 어는 이슬비',
    61: '약한 비', 63: '비', 65: '강한 비',
    66: '어는 비', 67: '강한 어는 비',
    71: '약한 눈', 73: '눈', 75: '강한 눈', 77: '싸락눈',
    80: '약한 소나기', 81: '소나기', 82: '강한 소나기',
    85: '약한 눈보라', 86: '강한 눈보라',
    95: '뇌우', 96: '우박을 동반한 뇌우', 99: '강한 우박을 동반한 뇌우',
  };
  return words[code] || `알 수 없는 날씨 (번호 ${code})`;
}

const $ = id => document.getElementById(id);

function show(which) {
  $('loading').hidden = which !== 'loading';
  $('error').hidden = which !== 'error';
  $('weather').hidden = which !== 'weather';
}

function showError(reason, hint) {
  $('error-text').innerHTML = '';
  $('error-text').append('날씨를 받아 오지 못했어요.');
  const small = document.createElement('small');
  small.textContent = reason + (hint ? ' ' + hint : '');
  $('error-text').append(small);
  show('error');
}

function round(n) { return Math.round(n) + '°'; }

async function loadWeather() {
  show('loading');

  if (navigator.onLine === false) {
    showError('인터넷에 연결되어 있지 않아요.', '연결을 확인하고 다시 불러와 주세요.');
    return;
  }

  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), WAIT_LIMIT);
  let data;
  try {
    const res = await fetch(API_URL, { signal: stop.signal });
    if (!res.ok) {
      showError(`날씨 서버가 오류를 알려 왔어요 (상태 번호 ${res.status}).`, '잠시 뒤에 다시 불러와 주세요.');
      return;
    }
    data = await res.json();
  } catch (e) {
    if (e.name === 'AbortError') showError('날씨 서버가 10초 동안 답하지 않았어요.', '잠시 뒤에 다시 불러와 주세요.');
    else showError('날씨 서버에 연결하지 못했어요.', '인터넷 연결을 확인해 주세요.');
    return;
  } finally {
    clearTimeout(timer);
  }

  const now = data && data.current;
  const day = data && data.daily;
  if (!now || typeof now.temperature_2m !== 'number' || typeof now.weather_code !== 'number'
      || !day || !day.temperature_2m_max || !day.temperature_2m_min) {
    showError('받은 정보가 예상한 모양과 달라요.', '잠시 뒤에 다시 불러와 주세요.');
    return;
  }

  $('temp').textContent = round(now.temperature_2m);
  $('desc').textContent = weatherWord(now.weather_code);
  $('max').textContent = round(day.temperature_2m_max[0]);
  $('min').textContent = round(day.temperature_2m_min[0]);
  const t = String(now.time || '');
  $('time').textContent = t ? `${t.slice(11, 16)} 기준` : '';
  show('weather');
}

$('retry').addEventListener('click', loadWeather);
loadWeather();
</script>
</body>
</html>
