<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 플레이리스트</title>
<style>
  /* 색: 초록이 중심. 글자는 진한 초록빛 검정, 바탕은 아주 옅은 초록빛 흰색 */
  :root {
    color-scheme: dark;
    --accent: #2be071;      /* 중심 초록: 아주 선명하게 */
    --accent-dim: #7ee8a6;
    --on-accent: #03140a;   /* 초록 위에 올리는 글자색 (검정에 가까움) */
    --bg: #000000;
    --card: #0c120e;
    --field: #060a07;
    --line: #1f3a29;
    --line-strong: #3a6a4a;
    --text: #eef8f1;
    --muted: #a3bba9;
    --danger: #ff7b7b;
    --star: #ffc83d;
    --star-off: #2f4437;
    --green-soft: #0f2c1a;
    --green-faint: #08150d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    background: var(--bg);
    color: var(--text);
  }
  button, input, select { font: inherit; }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 16px 16px 24px; }

  /* 위쪽 줄: 사이트 이름 + 로그인 자리 */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--accent);
  }
  h1 { margin: 0; font-size: clamp(19px, 5vw, 22px); font-weight: 700; color: var(--accent); }
  .sub { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
  #login-slot {
    min-width: 110px;
    padding: 10px 16px;
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    color: var(--muted);
    text-align: center;
  }

  #notice {
    margin: 12px 0 0;
    padding: 10px 14px;
    border-radius: 10px;
    background: #2a2008;
    border: 1px solid #7a5a12;
    color: #ffd78a;
    overflow-wrap: anywhere;
  }
  #notice[hidden] { display: none; }

  h2 { margin: 0; overflow-wrap: anywhere; }
  .panel {
    margin-top: 16px;
    padding: 18px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .panel h2 { margin-bottom: 10px; font-size: 17px; font-weight: 600; color: var(--accent); }

  /* 입력 */
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; color: var(--muted); flex: 1 1 160px; min-width: 0; }
  input[type=text], select {
    width: 100%;
    min-height: 46px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line-strong);
    background: var(--field);
    color: var(--text);
    font-size: 16px;
    font-weight: 400;
  }
  input[type=text]::placeholder { color: #7f9a88; }
  input[type=text]:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    min-height: 46px;
    padding: 8px 18px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button.plain { background: var(--green-faint); border-color: var(--line-strong); color: var(--text); font-weight: 500; }
  button.danger { background: transparent; border-color: #7a3438; color: var(--danger); }
  button.danger.confirm-delete { background: #d92d33; border-color: #d92d33; color: #fff; }
  .msg { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--danger); }
  .msg:empty { display: none; }

  /* 찾기·정렬 */
  .toolbar form { align-items: flex-end; }
  .toolbar label { flex: 1 1 200px; }
  #count { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--muted); }
  #count:empty { display: none; }

  /* 목록 */
  #list {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 16px;
  }
  #empty, #no-match { margin-top: 16px; padding: 24px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line-strong); border-radius: 14px; }
  #empty[hidden], #no-match[hidden] { display: none; }
  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    padding: 18px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .card[data-mine="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 22px rgba(43, 224, 113, 0.22); }
  .badge {
    align-self: flex-start;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--green-soft);
    border: 1px solid var(--line-strong);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }
  .badge.view { background: #121a15; border-color: var(--line); color: var(--muted); font-weight: 500; }

  /* 플레이리스트 제목: 화면에서 가장 큰 글자 */
  .card h2 { font-size: clamp(24px, 6.8vw, 30px); font-weight: 800; line-height: 1.25; color: #ffffff; letter-spacing: -0.01em; }
  .maker { margin: -4px 0 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }

  .rating { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .stars { display: flex; margin-left: -6px; }
  button.star {
    min-width: 42px;
    min-height: 46px;
    padding: 0;
    border: 0;
    background: transparent;
    font-size: 28px;
    line-height: 1;
    color: var(--star-off);
  }
  button.star.on { color: var(--star); }
  .avg { font-size: 15px; color: var(--muted); }

  ol.songs { margin: 0; padding-left: 26px; }
  ol.songs li { position: relative; padding: 5px 0; overflow-wrap: anywhere; transition: transform 0.12s; }
  ol.songs li::marker { color: var(--muted); }
  ol.songs li.dragging { transition: none; z-index: 2; background: var(--green-soft); border-radius: 8px; box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(0, 0, 0, 0.7); }
  ol.songs li.now { color: var(--accent); font-weight: 700; }
  ol.songs li.now .artist { color: var(--accent-dim); }
  .songs .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .songs .row span { min-width: 0; }
  .songs .row > span { flex: 1; }
  .artist { color: var(--muted); font-size: 15px; font-weight: 400; }
  button.handle { flex: none; min-width: 42px; min-height: 42px; padding: 0 8px; touch-action: none; cursor: grab; user-select: none; }
  button.handle::before { content: '≡'; font-size: 22px; line-height: 1; }
  button.small { min-height: 42px; padding: 4px 12px; font-size: 14px; flex: none; }
  .hint { margin: 0; font-size: 14px; color: var(--muted); word-break: keep-all; }
  .no-songs { margin: 0; color: var(--muted); font-size: 15px; }

  /* 재생 줄 */
  .player { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--green-faint); border: 1px solid var(--line); }
  .player button { flex: none; }
  .player button.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .player button:disabled { opacity: 0.45; cursor: default; }
  .now-text { flex: 1 1 100%; min-width: 0; font-size: 15px; color: var(--accent); overflow-wrap: anywhere; word-break: keep-all; }

  /* 내 것을 고치는 도구 */
  .tools { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tools form { align-items: flex-end; }
  .tools label { flex-basis: 120px; }
  .view-note { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .confirm p { margin: 0; flex-basis: 100%; }

  .view-note, footer, .sub { word-break: keep-all; }
  footer { margin: 24px 0 8px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>내 플레이리스트</h1>
      <p class="sub">플레이리스트를 만들어 두고 언제든지 즐겨요</p>
    </div>
    <div id="login-slot">로그인 자리</div>
  </header>

  <p id="notice" role="status" hidden></p>

  <section class="panel" aria-labelledby="create-title">
    <h2 id="create-title">새 플레이리스트 만들기</h2>
    <form id="create-form" autocomplete="off">
      <label>플레이리스트 이름
        <input type="text" id="new-name" maxlength="40" placeholder="예: 비 오는 날 노래">
      </label>
      <label>만든 사람 (별명)
        <input type="text" id="new-nick" maxlength="20" placeholder="실명 말고 별명">
      </label>
      <button type="submit">만들기</button>
      <p class="msg" id="create-msg" role="alert"></p>
    </form>
  </section>

  <section class="panel toolbar" aria-label="찾기와 정렬">
    <form id="filter-form" autocomplete="off">
      <label>찾기 (플레이리스트 이름)
        <input type="text" id="search" maxlength="40" placeholder="이름 일부를 적어 보세요">
      </label>
      <label>정렬
        <select id="sort">
          <option value="new">최근 만든 순</option>
          <option value="stars">별점 높은 순</option>
        </select>
      </label>
      <p id="count" role="status"></p>
    </form>
  </section>

  <p id="empty" hidden>아직 플레이리스트가 없어요. 위에서 하나 만들어 보세요.</p>
  <p id="no-match" hidden>찾는 이름의 플레이리스트가 없어요. 다른 글자로 찾아 보세요.</p>
  <section id="list" aria-label="플레이리스트 목록"></section>

  <footer>
    플레이리스트는 이 기기의 브라우저에만 저장돼요. 다른 사람의 것은 볼 수만 있고 고치거나 지울 수 없어요.
    처음 들어 있는 두 개는 보여 주려고 넣은 예시이고, 곡 이름도 지어낸 거예요.
    재생하면 진짜 곡 대신, 곡 이름으로 만든 짧은 멜로디가 나와요.
  </footer>
</div>

<script>
'use strict';

/* ---------- 저장하는 코드는 여기 한곳에만 있어요 ---------- */
const Store = (() => {
  const KEY = 'week07-music';
  let ok = true; // 브라우저가 저장을 허락하는지

  function newId() {
    return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function seed() {
    return {
      myId: newId(), // 이 기기(브라우저)를 알아보는 표시. 로그인이 아니에요.
      nick: '',
      playlists: [
        { id: 'sample-1', owner: 'sample-a', maker: '구름이', name: '비 오는 날 듣는 노래',
          songs: [{ t: '빗소리 산책', a: '달빛 밴드' }, { t: '우산 아래서', a: '하늘 트리오' }, { t: '창가의 오후', a: '달빛 밴드' }],
          ratings: { x1: 5, x2: 4, x3: 4 } },
        { id: 'sample-2', owner: 'sample-b', maker: '바람이', name: '운동할 때 듣는 노래',
          songs: [{ t: '한 바퀴 더', a: '번개 크루' }, { t: '숨이 차도', a: '번개 크루' }, { t: '결승선', a: '파도 합창단' }],
          ratings: { x1: 4, x2: 5 } },
      ],
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.myId && Array.isArray(d.playlists)) return d;
      }
    } catch (e) {
      ok = false;
    }
    return seed();
  }

  function save(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      ok = true;
    } catch (e) {
      ok = false;
    }
    return ok;
  }

  return { load, save, newId, isOk: () => ok };
})();

/* ---------- 나머지는 화면 ---------- */
const data = Store.load();
const $ = id => document.getElementById(id);
const cardState = new Map();

/* ---------- 재생 (소리 파일 대신, 곡 이름으로 짧은 멜로디를 만들어 들려줘요) ---------- */
const Player = (() => {
  const SCALE = [261.63, 293.66, 329.63, 392, 440, 523.25];
  const NOTES = 12, NOTE_SEC = 0.35, SONG_MS = NOTES * NOTE_SEC * 1000;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  let ctx = null;
  let s = null; // 지금 상태: { plId, index, order, playing, remaining, startedAt, timer, nodes }
  // order: 들을 차례 (곡 번호가 줄지어 있어요). 섞어 듣기가 꺼져 있으면 0,1,2,3…, 켜져 있으면 섞인 차례예요.
  const opts = new Map(); // 목록마다 섞어 듣기·한 곡 반복을 켰는지 (저장하지 않아요)
  const optsOf = id => { if (!opts.has(id)) opts.set(id, { shuffle: false, repeat: false }); return opts.get(id); };

  // first 곡을 맨 앞에 두고 나머지를 섞어요 (섞어 듣기가 꺼져 있으면 그냥 차례대로)
  function makeOrder(id, first) {
    const all = Array.from({ length: songsOf(id).length }, (_, i) => i);
    if (!optsOf(id).shuffle) return all;
    const rest = all.filter(i => i !== first);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    return [first, ...rest];
  }
  const posOf = () => s.order.indexOf(s.index);

  function hash(str) {
    let x = 2166136261;
    for (const ch of str) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); }
    return x >>> 0;
  }
  const songsOf = id => { const pl = data.playlists.find(p => p.id === id); return pl ? pl.songs : []; };

  function stopNodes() {
    if (!s) return;
    clearTimeout(s.timer);
    for (const o of s.nodes || []) { try { o.stop(); } catch (e) {} }
    s.nodes = [];
  }

  function startSong() {
    stopNodes();
    const song = songsOf(s.plId)[s.index];
    if (!song) return stop();
    let seed = hash(song.t + '|' + song.a);
    const t0 = ctx.currentTime + 0.05;
    for (let i = 0; i < NOTES; i++) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      const a = t0 + i * NOTE_SEC;
      osc.type = 'triangle';
      osc.frequency.value = SCALE[(seed >>> 16) % SCALE.length];
      g.gain.setValueAtTime(0, a);
      g.gain.linearRampToValueAtTime(0.18, a + 0.03);
      g.gain.linearRampToValueAtTime(0, a + NOTE_SEC - 0.03);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(a); osc.stop(a + NOTE_SEC);
      s.nodes.push(osc);
    }
    s.remaining = SONG_MS; s.startedAt = Date.now(); s.playing = true;
    s.timer = setTimeout(ended, SONG_MS);
    syncAll();
  }

  function ended() {
    if (!s) return;
    if (optsOf(s.plId).repeat) return startSong(); // 한 곡 반복: 같은 곡을 처음부터 다시
    const pos = posOf();
    if (pos + 1 < s.order.length) { s.index = s.order[pos + 1]; startSong(); }
    else stop(); // 마지막 곡이 끝나면 멈춰요
  }

  function stop() {
    stopNodes();
    s = null;
    syncAll();
  }

  function wake() { if (ctx.state === 'suspended') ctx.resume(); }

  return {
    supported: !!Ctor,
    state: () => (s ? { plId: s.plId, index: s.index, playing: s.playing, pos: posOf(), hasNext: posOf() + 1 < s.order.length } : null),
    option: (id, key) => optsOf(id)[key],
    // 섞어 듣기·한 곡 반복을 켜고 끄기. 듣는 중에 섞어 듣기를 바꿔도 듣던 곡은 그대로 이어져요.
    setOption(id, key) {
      const o = optsOf(id);
      o[key] = !o[key];
      if (key === 'shuffle' && s && s.plId === id) s.order = makeOrder(id, s.index);
      syncAll();
    },
    // 듣는 중에 곡이 새로 들어오면 차례 맨 끝에 붙여요
    added(id) {
      if (!s || s.plId !== id) return;
      for (let i = 0; i < songsOf(id).length; i++) if (!s.order.includes(i)) s.order.push(i);
      syncAll();
    },
    stopIf(id) { if (s && s.plId === id) stop(); },
    // 곡이 from 칸에서 to 칸으로 옮겨졌을 때, 듣던 곡을 그대로 따라가요 (다시 시작하지 않아요)
    moved(id, from, to) {
      if (!s || s.plId !== id) return;
      const m = i => (i === from ? to : from < i && i <= to ? i - 1 : to <= i && i < from ? i + 1 : i);
      s.index = m(s.index);
      // 섞어 듣기가 꺼져 있으면 차례는 늘 0,1,2,3… 이고, 켜져 있으면 섞인 차례의 곡 번호만 새 자리로 바꿔 줘요
      s.order = optsOf(id).shuffle ? s.order.map(m) : makeOrder(id, s.index);
    },
    toggle(id) {
      if (!Ctor || !songsOf(id).length) return;
      if (!ctx) ctx = new Ctor();
      if (s && s.plId === id) {
        if (s.playing) { // 멈춤: 남은 시간을 기억해 두고 소리도 멈춰요
          clearTimeout(s.timer);
          s.remaining -= Date.now() - s.startedAt;
          s.playing = false;
          ctx.suspend();
          syncAll();
        } else { // 이어서 듣기
          wake();
          s.startedAt = Date.now(); s.playing = true;
          s.timer = setTimeout(ended, Math.max(s.remaining, 0));
          syncAll();
        }
      } else { // 다른 목록(또는 처음): 첫 곡부터
        stopNodes();
        const first = optsOf(id).shuffle ? Math.floor(Math.random() * songsOf(id).length) : 0;
        s = { plId: id, index: first, nodes: [], order: makeOrder(id, first) };
        wake();
        startSong();
      }
    },
    next(id) {
      if (!s || s.plId !== id || posOf() + 1 >= s.order.length) return;
      s.index = s.order[posOf() + 1]; wake(); startSong();
    },
    prev(id) { // 첫 곡에서는 그 곡을 처음부터 다시
      if (!s || s.plId !== id) return;
      s.index = s.order[Math.max(0, posOf() - 1)]; wake(); startSong();
    },
  };
})();

const isNow = (pl, i) => { const st = Player.state(); return !!st && st.plId === pl.id && st.index === i; };

function renderPlayer(pl) {
  const st = Player.state();
  const active = !!st && st.plId === pl.id && !!pl.songs[st.index];
  const cur = active ? pl.songs[st.index] : null;
  const playing = active && st.playing;
  const modes = [Player.option(pl.id, 'shuffle') && '섞어 듣기', Player.option(pl.id, 'repeat') && '한 곡 반복'].filter(Boolean);
  const modeText = modes.length ? ' · ' + modes.join(' · ') : '';
  const text = active ? `${playing ? '재생 중' : '멈춤'}: ${cur.t} · ${cur.a} (${st.pos + 1}/${pl.songs.length})${modeText}`
    : Player.supported ? '재생을 누르면 첫 곡부터 들려요' : '이 브라우저에서는 소리를 낼 수 없어요';
  return h('div', { class: 'player' },
    h('button', { type: 'button', class: 'plain prev', 'data-role': 'prev', disabled: !active, onclick: () => Player.prev(pl.id) }, '이전 곡'),
    h('button', { type: 'button', class: 'play', 'data-role': 'play', disabled: !Player.supported, onclick: () => Player.toggle(pl.id) }, playing ? '멈춤' : '재생'),
    h('button', { type: 'button', class: 'plain next', 'data-role': 'next', disabled: !active || !st.hasNext, onclick: () => Player.next(pl.id) }, '다음 곡'),
    h('button', { type: 'button', class: 'plain toggle', 'data-role': 'shuffle', 'aria-pressed': String(Player.option(pl.id, 'shuffle')), onclick: () => Player.setOption(pl.id, 'shuffle') }, '섞어 듣기'),
    h('button', { type: 'button', class: 'plain toggle', 'data-role': 'repeat', 'aria-pressed': String(Player.option(pl.id, 'repeat')), onclick: () => Player.setOption(pl.id, 'repeat') }, '한 곡 반복'),
    h('span', { class: 'now-text', role: 'status' }, text));
}

// 재생 줄과 '지금 듣는 곡' 표시만 바꿔요 (카드를 통째로 다시 그리지 않아서 적던 글자가 안 지워져요)
function syncAll() {
  for (const pl of data.playlists) {
    const card = document.querySelector(`.card[data-id="${CSS.escape(pl.id)}"]`);
    if (!card) continue;
    const old = card.querySelector('.player');
    if (old) {
      const role = old.contains(document.activeElement) ? document.activeElement.dataset.role : null;
      const fresh = renderPlayer(pl);
      old.replaceWith(fresh);
      const target = role && fresh.querySelector(`[data-role="${role}"]`);
      if (target && !target.disabled) target.focus();
    }
    card.querySelectorAll('li.song').forEach((li, i) => li.classList.toggle('now', isNow(pl, i)));
  }
} // 카드마다 '지울까요?' 같은 임시 상태

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

function persist() {
  const saved = Store.save(data);
  const n = $('notice');
  n.hidden = saved;
  n.textContent = saved ? '' : '이 브라우저가 저장을 막아서, 지금 화면에서만 보이고 닫으면 사라져요.';
}

const isMine = pl => pl.owner === data.myId;

function average(pl) {
  const v = Object.values(pl.ratings || {});
  return v.length ? { avg: v.reduce((a, b) => a + b, 0) / v.length, count: v.length } : null;
}

function renderCard(pl) {
  const mine = isMine(pl);
  const st = cardState.get(pl.id) || {};
  const avg = average(pl);
  const myRate = (pl.ratings || {})[data.myId] || 0;

  const stars = h('div', { class: 'stars', role: 'group', 'aria-label': '별점 주기' },
    [1, 2, 3, 4, 5].map(n => h('button', {
      type: 'button', class: 'star' + (n <= myRate ? ' on' : ''), 'data-n': n,
      'aria-label': `별 ${n}개 주기`, 'aria-pressed': n <= myRate ? 'true' : 'false',
      onclick: () => rate(pl.id, n),
    }, '★')));

  const songs = pl.songs.length
    ? h('ol', { class: 'songs' }, pl.songs.map((s, i) => h('li', { class: 'song' + (isNow(pl, i) ? ' now' : '') },
        h('div', { class: 'row' },
          mine && h('button', { type: 'button', class: 'plain handle', 'aria-label': `${s.t} 순서 바꾸기 (끌거나, 위·아래 화살표 키)`,
            onpointerdown: e => dragStart(e, pl.id, i),
            onkeydown: e => handleKey(e, pl.id, i) }),
          h('span', null, s.t, ' ', h('span', { class: 'artist' }, '· ' + s.a)),
          mine && h('button', { type: 'button', class: 'plain small remove-song', 'aria-label': `${s.t} 빼기`, onclick: () => removeSong(pl.id, i) }, '빼기')))))
    : h('p', { class: 'no-songs' }, '아직 들어 있는 곡이 없어요.');

  let tools;
  if (!mine) {
    tools = h('p', { class: 'view-note no-edit-note' }, '다른 사람이 만든 거라 볼 수만 있어요. 고치거나 지울 수 없어요.');
  } else {
    tools = h('div', { class: 'tools' },
      h('form', { class: 'add-song', autocomplete: 'off', onsubmit: e => { e.preventDefault(); addSong(pl.id, e.target); } },
        h('label', null, '곡 이름', h('input', { type: 'text', name: 'title', maxlength: 60 })),
        h('label', null, '가수', h('input', { type: 'text', name: 'artist', maxlength: 40 })),
        h('button', { type: 'submit' }, '곡 넣기'),
        h('p', { class: 'msg', role: 'alert' }, st.songMsg || '')),
      h('form', { class: 'rename', autocomplete: 'off', onsubmit: e => { e.preventDefault(); rename(pl.id, e.target); } },
        h('label', null, '이름 바꾸기', h('input', { type: 'text', name: 'name', maxlength: 40, value: pl.name })),
        h('button', { type: 'submit', class: 'plain' }, '바꾸기'),
        h('p', { class: 'msg', role: 'alert' }, st.nameMsg || '')),
      st.confirming
        ? h('div', { class: 'confirm' },
            h('p', null, `"${pl.name}" 을(를) 정말 지울까요? 되돌릴 수 없어요.`),
            h('button', { type: 'button', class: 'danger confirm-delete', onclick: () => removePlaylist(pl.id) }, '지우기'),
            h('button', { type: 'button', class: 'plain cancel-delete', onclick: () => setState(pl.id, { confirming: false }) }, '취소'))
        : h('button', { type: 'button', class: 'danger delete', onclick: () => setState(pl.id, { confirming: true }) }, '이 플레이리스트 지우기'));
  }

  return h('article', { class: 'card', 'data-id': pl.id, 'data-mine': mine ? 'true' : 'false' },
    h('span', { class: 'badge' + (mine ? '' : ' view') }, mine ? '내가 만든 것' : '보기만 해요'),
    h('h2', null, pl.name),
    h('p', { class: 'maker' }, '만든 사람: ', h('strong', null, pl.maker)),
    h('div', { class: 'rating' }, stars,
      h('span', { class: 'avg' }, avg ? `${avg.avg.toFixed(1)}점 (${avg.count}명)` : '아직 별점이 없어요')),
    songs,
    mine && pl.songs.length > 1 ? h('p', { class: 'hint' }, '≡ 를 끌어서 곡 순서를 바꿔요. (키보드: ≡ 에서 위·아래 화살표)') : null,
    pl.songs.length ? renderPlayer(pl) : null,
    tools);
}

// 찾은 것만, 고른 순서로. (정렬은 그릴 때만 해요. 별점을 눌러도 카드가 갑자기 자리를 옮기지 않아요)
function visibleList() {
  const q = $('search').value.toLowerCase().replace(/\s+/g, '');
  let list = data.playlists.filter(pl => !q || pl.name.toLowerCase().replace(/\s+/g, '').includes(q));
  if ($('sort').value === 'stars') {
    // 별점 높은 순. 별점이 없는 것은 맨 뒤, 같은 점수끼리는 최근 만든 순
    const score = pl => { const a = average(pl); return a ? a.avg : -1; };
    list = list.map((pl, i) => ({ pl, i })).sort((x, y) => score(y.pl) - score(x.pl) || x.i - y.i).map(e => e.pl);
  }
  return list;
}

function renderAll() {
  const list = visibleList();
  const total = data.playlists.length;
  $('list').replaceChildren(...list.map(renderCard));
  $('empty').hidden = total > 0;
  $('no-match').hidden = !(total > 0 && list.length === 0);
  $('count').textContent = total ? `전체 ${total}개 중 ${list.length}개 보여요` : '';
}

function refreshCard(id) {
  const pl = data.playlists.find(p => p.id === id);
  const old = $('list').querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (pl && old) old.replaceWith(renderCard(pl));
}

function setState(id, patch) {
  cardState.set(id, Object.assign(cardState.get(id) || {}, patch));
  refreshCard(id);
}

/* ---------- 동작 ---------- */
function clean(s) { return String(s).trim().replace(/\s+/g, ' '); }

function create(name, nick) {
  name = clean(name); nick = clean(nick);
  if (!name) return '플레이리스트 이름을 적어 주세요.';
  if (!nick) return '만든 사람 별명을 적어 주세요.';
  data.nick = nick;
  $('search').value = ''; // 찾기에 걸려 새 것이 안 보이는 일이 없게
  data.playlists.unshift({ id: Store.newId(), owner: data.myId, maker: nick, name, songs: [], ratings: {} });
  persist();
  renderAll();
  return '';
}

function addSong(id, form) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl || !isMine(pl)) return;
  const t = clean(form.title.value), a = clean(form.artist.value);
  if (!t || !a) return setState(id, { songMsg: '곡 이름과 가수를 모두 적어 주세요.' });
  if (pl.songs.length >= 50) return setState(id, { songMsg: '곡은 50개까지 넣을 수 있어요.' });
  pl.songs.push({ t, a });
  Player.added(id);
  persist();
  setState(id, { songMsg: '' });
}

function removeSong(id, index) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl || !isMine(pl)) return;
  Player.stopIf(id);
  pl.songs.splice(index, 1);
  persist();
  refreshCard(id);
}

// 곡 순서 바꾸기: from 칸의 곡을 to 칸으로
function moveSong(id, from, to, focusHandle) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl || !isMine(pl)) return;
  if (from === to || to < 0 || to >= pl.songs.length) return;
  pl.songs.splice(to, 0, pl.songs.splice(from, 1)[0]);
  Player.moved(id, from, to);
  persist();
  refreshCard(id);
  if (focusHandle) {
    const el = document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"] li.song`)[to];
    const btn = el && el.querySelector('.handle');
    if (btn) btn.focus();
  }
}

// 끌어서 옮기기: 끄는 동안은 화면에서만 움직이고, 손을 떼면 한 번에 바꿔요 (마우스·손가락 모두).
// 손잡이 밖으로 나가도 계속 따라오게 움직임은 창 전체에서 들어요.
let dragging = null;
function dragStart(e, id, from) {
  if (e.button !== undefined && e.button !== 0) return;
  const handle = e.currentTarget;
  const rows = [...handle.closest('ol').children];
  e.preventDefault();
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  rows[from].classList.add('dragging');
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragUp);
  window.addEventListener('pointercancel', dragCancel);
  dragging = { id, from, target: from, rows, rects: rows.map(li => li.getBoundingClientRect()), startY: e.clientY, pid: e.pointerId };
}
function dragMove(e) {
  const d = dragging;
  if (!d || e.pointerId !== d.pid) return;
  const dy = e.clientY - d.startY;
  const me = d.rects[d.from];
  const center = me.top + me.height / 2 + dy;
  let target = 0;
  d.rects.forEach((r, j) => { if (j !== d.from && r.top + r.height / 2 < center) target++; });
  d.target = target;
  d.rows.forEach((li, j) => {
    if (j === d.from) { li.style.transform = `translateY(${dy}px)`; return; }
    let shift = 0;
    if (d.from < target && j > d.from && j <= target) shift = -me.height;
    if (d.from > target && j >= target && j < d.from) shift = me.height;
    li.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
const dragUp = e => dragEnd(e, true);
const dragCancel = e => dragEnd(e, false);
function dragEnd(e, commit) {
  const d = dragging;
  if (!d || e.pointerId !== d.pid) return;
  dragging = null;
  window.removeEventListener('pointermove', dragMove);
  window.removeEventListener('pointerup', dragUp);
  window.removeEventListener('pointercancel', dragCancel);
  for (const li of d.rows) { li.style.transform = ''; li.classList.remove('dragging'); }
  if (commit && d.target !== d.from) moveSong(d.id, d.from, d.target, true);
}
function handleKey(e, id, i) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  moveSong(id, i, i + (e.key === 'ArrowUp' ? -1 : 1), true);
}

function rename(id, form) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl || !isMine(pl)) return;
  const name = clean(form.name.value);
  if (!name) return setState(id, { nameMsg: '이름을 비워 둘 수 없어요.' });
  pl.name = name;
  persist();
  setState(id, { nameMsg: '' });
}

function removePlaylist(id) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl || !isMine(pl)) return;
  Player.stopIf(id);
  data.playlists = data.playlists.filter(p => p.id !== id);
  cardState.delete(id);
  persist();
  renderAll();
}

// 별점은 누구나 줄 수 있어요 (내 별점은 내 표시로 하나만 남아요). 같은 별을 다시 누르면 취소.
function rate(id, n) {
  const pl = data.playlists.find(p => p.id === id);
  if (!pl) return;
  pl.ratings = pl.ratings || {};
  if (pl.ratings[data.myId] === n) delete pl.ratings[data.myId];
  else pl.ratings[data.myId] = n;
  persist();
  refreshCard(id);
}

$('create-form').addEventListener('submit', e => {
  e.preventDefault();
  const msg = create($('new-name').value, $('new-nick').value);
  $('create-msg').textContent = msg;
  if (!msg) $('new-name').value = '';
});

$('search').addEventListener('input', renderAll);
$('sort').addEventListener('change', renderAll);
$('filter-form').addEventListener('submit', e => e.preventDefault());

$('new-nick').value = data.nick || '';
renderAll();
// 저장이 막혀 있는지 처음부터 알려 줘요 (읽을 때 막혔다면 여기서 보여요)
if (!Store.isOk()) persist();
</script>
</body>
</html>
